function zone(index){const z=zones[index];move({selected:index,view:'zone',target:z.target.slice(),yaw:z.yaw,pitch:z.pitch,distance:z.d});}
root.querySelector('#lv-zone').onchange=e=>zone(Number(e.target.value));root.querySelector('#lv-route').onchange=e=>{state.route=e.target.checked;ui();draw();save();};root.querySelector('#lv-evening').onchange=e=>{state.evening=e.target.checked;ui();draw();save();};
root.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const view=b.dataset.view;if(view==='top')move({view,yaw:0,pitch:1.56,distance:27,target:[0,0,0]});else if(view==='interior')move({view,yaw:.10,pitch:.10,distance:12.0,target:[0,1.35,-3.6]});else move({view,yaw:.52,pitch:.72,distance:28,target:[0,.6,0]});});
root.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='tour')return zone(0);if(a==='next')return zone((state.selected+1)%6);if(a==='left'||a==='right')move({view:'free',yaw:state.yaw+(a==='left'?-.25:.25)});if(a==='in'||a==='out')move({distance:T.MathUtils.clamp(state.distance*(a==='in'?.83:1.2),3,44)});});
const pointers=new Map();let pinchDistance=0;canvas.onpointerdown=e=>{cancelAnimationFrame(frameId);canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const p=[...pointers.values()];pinchDistance=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);}};
canvas.onpointermove=e=>{const prev=pointers.get(e.pointerId);if(!prev)return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(pinchDistance>0)state.distance=T.MathUtils.clamp(state.distance*pinchDistance/Math.max(1,d),3,44);pinchDistance=d;}else{state.yaw-=(e.clientX-prev.x)*.006;state.pitch=T.MathUtils.clamp(state.pitch+(e.clientY-prev.y)*.005,.05,1.56);state.view='free';}ui();draw();};
function release(e){pointers.delete(e.pointerId);pinchDistance=0;save();}canvas.onpointerup=release;canvas.onpointercancel=release;
canvas.addEventListener('wheel',e=>{e.preventDefault();cancelAnimationFrame(frameId);state.distance=T.MathUtils.clamp(state.distance*Math.exp(e.deltaY*.001),3,44);draw();save();},{passive:false});
new ResizeObserver(()=>{const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();draw();}).observe(stage);
window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState?.privateContent;if(saved?.version!==2)return;cancelAnimationFrame(frameId);restore(saved);ui();draw();});
root.querySelector('#lv-system').onchange=e=>{showSystem(e.target.value);move({view:'overview',yaw:.52,pitch:.78,distance:27,target:[0,.9,0]});};
window.lassardModel={scene,model,renderer,camera,route,systems,getState:()=>JSON.parse(JSON.stringify(state))};ui();draw();
})();
</script>
